name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libosmesa6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: fetch hand models
        run: uv run python scripts/fetch_models.py
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: pytest
        env:
          MUJOCO_GL: osmesa
        run: uv run pytest
