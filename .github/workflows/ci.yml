name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: fetch hand models
        run: uv run python scripts/fetch_models.py
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: pytest
        # Offscreen-render tests self-skip via the offscreen_render_ok probe when EGL can't render (no GPU).
        # MUJOCO_GL=osmesa segfaults when torchvision is imported alongside it, so stay on egl.
        run: uv run pytest
      - name: record test diagnostics (non-blocking)
        continue-on-error: true
        env:
          TELEOP_RUN_RECORD_TEST: "1"
        run: uv run python -X faulthandler -m pytest tests/test_app.py::test_record_two_short_episodes -s -vv -p no:cacheprovider; echo "exit=$?"
