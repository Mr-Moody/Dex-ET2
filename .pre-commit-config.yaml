repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--scopes, "input,sim,retarget,record,train,cli,infra,docs,tasks,net,atc,unoq", feat, fix, chore, docs, refactor, test, perf, build, ci, style, revert]
