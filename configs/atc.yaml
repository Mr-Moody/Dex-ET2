# teleop atc defaults. Every key can be overridden by the matching command-line flag.
source: studio             # studio (scripted rescue when no glove packets) | synthetic | replay
replay_file: null          # required with source: replay
studio:
  host: 0.0.0.0
  port: 14043
wrist_mode: auto           # auto | coil | imu (glove wrist; the clutch maps it relatively)
calibration: null          # glove calibration JSON from `teleop calibrate`
unoq_host: unoq.local      # UNO Q edge node; falls back to a local loopback node
unoq_udp_port: 15051
unoq_tcp_port: 15052
serial_port: null          # UNO Q MCU console on a laptop serial port (UNOQ_SERIAL_PORT)
hotspot: true              # keep the booth hotspot up (Windows; --no-hotspot; off with --headless)
background_bays: true      # kinematic Bays 3-4 for the 4-bay layout
cycle_dwell_s: 1.8         # dwell between pallet cycles (belt advances cleared pack out)
audio: true                # spoken status cues (always off with --headless)
script: false              # play the 6-beat stage script (rehearsal autopilot)
hud_log_period_s: 5.0      # headless: print the HUD every N sim seconds (0 = never)
display: console           # console (browser CCTV wall, default) | viewer (MuJoCo passive viewer)
console_port: 8765         # fleet ops console at http://127.0.0.1:<port>/
console_fps: 30            # camera feed frame rate
open_browser: true         # open the console page on start (false: just print the URL)
recovery_backend: dmp      # dmp (default, learned DMP skills) | hybrid (gated ACT + DMP) | act; M cycles live
act_checkpoint: null       # ACT run dir with gate.json, from `teleop eval` (hybrid / act)
record_episodes: null      # directory: save every recovery as a LeRobot episode (off when null)
seed: null                 # run seed (null: scripted stage uses its fixed STAGE_SEED, else 0)
realism: 0.25              # latch-pose error + gate randomization scale: 1 full, 0 off (exact pose)
gate_pass_min: 18          # randomized skill gate: deploy at >= this many of 20 rollouts
