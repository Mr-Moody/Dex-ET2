# teleop atc defaults. Every key can be overridden by the matching command-line flag.
source: synthetic          # studio | synthetic | replay (glove input for operator rescues)
replay_file: null          # required with source: replay
studio:
  host: 0.0.0.0
  port: 14043
wrist_mode: auto           # auto | coil | imu (glove wrist; the clutch maps it relatively)
calibration: null          # glove calibration JSON from `teleop calibrate`
unoq_host: unoq.local      # UNO Q edge node; falls back to a local loopback node
unoq_udp_port: 15051
unoq_tcp_port: 15052
serial_port: null          # UNO Q MCU console on a laptop serial port (UNOQ_SERIAL_PORT)
background_bays: true      # kinematic Bays 3-4 for the 4-bay layout
cycle_dwell_s: 1.0         # pause between pallet cycles on a bay
audio: true                # spoken status cues (always off with --headless)
script: false              # play the 6-beat stage script (rehearsal autopilot)
hud_log_period_s: 5.0      # headless: print the HUD every N sim seconds (0 = never)
